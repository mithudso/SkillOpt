name: Static metadata

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install developer tools
        run: pip install -e ".[dev]"
      - name: Check syntax and undefined names
        run: ruff check --select E9,F63,F7,F82 skillopt skillopt_sleep skillopt_webui scripts tests
      - name: Check static documentation inventories
        run: python scripts/doc_inventory.py --check
